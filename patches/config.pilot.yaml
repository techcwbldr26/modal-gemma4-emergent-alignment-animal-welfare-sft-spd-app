backend: ollama
model: glm-5.3-flash
max_tokens: 16000
temperature: 1.0
workers: 2
evals:
  judge_model: deepseek-v4-flash:0731
sdf:
  n_prompts: 8
  seed: 0
  entity_pool_seed: 137
  min_score_threshold: 7
  near_dup_threshold: 0.9
dad:
  scenario_model: deepseek-v4-flash:0731
  scenario_refusal_fallback_model: glm-5.3-flash
  prompt_draft_model: deepseek-v4-flash:0731
  prompt_gate_model: deepseek-v4-flash:0731
  prompt_refine_model: deepseek-v4-flash:0731
  response_scope_model: deepseek-v4-flash:0731
  scope_refusal_fallback_model: glm-5.3-flash
  response_select_model: deepseek-v4-flash:0731
  response_draft_model: deepseek-v4-flash:0731
  constitution_rewrite_model: deepseek-v4-flash:0731
  baseline:
    enabled: true
    model: claude-opus-5
  evals:
    auto: true
  dilemmas:
    count: 40
    seed_path: null
    scenario_seed: null
    gate: true
    refine: true
  responses:
    per_prompt: 1
pref:
  prompts_path: null
  arms:
    a:
      name: baseline
      system_prompt: ''
    b:
      name: candidate
      system_prompt: ''
language_distribution:
  en: 1.0
outputs:
  sdf_final: outputs/sdf/final/sdf_corpus.jsonl
  dad_final: outputs/dad/final/dad_corpus.jsonl
  cost_log: outputs/cost_log.jsonl
